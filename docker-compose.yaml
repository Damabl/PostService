version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: postgresPost
    restart: always
    environment:
      POSTGRES_USER: postgresPost
      POSTGRES_PASSWORD: saturdaySpring
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    environment:
      MINIO_ROOT_USER: user
      MINIO_ROOT_PASSWORD: Damir2005
    command: server /data --console-address ":9090" --address ":9000"
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
